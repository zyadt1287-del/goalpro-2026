<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><title>GoalPro v18</title>
<style>
body{background:#050811; color:#fff; padding-bottom:150px;}
.bottom-news{position: fixed; bottom: 0; left: 0; width: 100%; height: 140px; background: #000; border-top: 3px solid #FFB800; z-index: 9999; padding: 8px;}
.match-header{text-align:center; font-weight:900; color:#FFB800;}
.lineup-row{display:flex; justify-content:space-between;}
.player-card img{width:32px; height:32px; border-radius:50%; border:2px solid #FFB800;}
.tour{cursor:pointer; padding:8px; background:#0B1120; margin:5px; border-radius:6px;}
</style>
</head>
<body>
<div><h3>🏆 190+ Worldwide Tournaments 2026-2034</h3>
<input type="text" id="searchInput" placeholder="Search tournament... ابحث عن بطولة" style="width:100%; padding:10px;">
<div id="toursList"></div>
</div>

<div class="bottom-news">
<div class="match-header">Select a tournament to see match lineup</div>
<div class="lineup-row">
<div><div>TEAM A</div><div id="teamA"></div></div>
<div>VS</div>
<div><div>TEAM B</div><div id="teamB"></div></div>
</div>
</div>

<script>
const tournaments = [["UCL","Europe"],["Premier League","England"],["World Cup 2026","FIFA"]];
for(let i=1; i<=187; i++){ tournaments.push([`League ${i}`,"Worldwide"]); }
tournaments.forEach(t=>{
document.getElementById('toursList').innerHTML += `<div class="tour" onclick="alert('تم اختيار ${t[0]}')">${t[0]} - ${t[1]}</div>`;
});
</script>
</body>
</html>
