   .card { background: var(--card); border-radius: 15px; padding: 18px; box-shadow: 0 4px 15px rgba(56,189,248,0.15); border-top: 4px solid var(--accent); cursor: pointer; transition: 0.3s; text-align: right; font-size: 14px; position: relative; }

   .tag { font-size: 12px; background: var(--accent); color: var(--bg); padding: 4px 7px; border-radius: 6px; margin-left: 6px; }
   .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 999; }

    #map { height: 250px; border-radius: 15px; margin: 15px 0; }
   .countdown { color: #fbbf24; font-weight: bold; font-size: 13px; }
   .live-link { background: var(--live); color: white; display: block; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 12px; text-align: center; font-weight: bold; }

function isLive(start, end) {
  const now = new Date();
  const s = new Date(start);
  const e = new Date(end);
  return now >= s && now <= e;
}

function getCountdown(date) {
  const diff = new Date(date) - new Date();
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  return days > 0? (lang==='ar'?`يبدأ بعد ${days} يوم`:`Starts in ${days} days`) : (lang==='ar'?"مباشر الان 🔴":"Live Now 🔴");
}

function showDetails(i) {
  const t = data[i];
  const liveBtn = t.live? `<a href="${t.live}" target="_blank" class="live-link">📺 ${lang==='ar'?'مشاهدة البث المباشر':'Watch Live'}</a>` : '';
  document.getElementById('modal-content').innerHTML = `
    <h2>${t.name[lang]}</h2>
    <p><b>${lang==='ar'?'التاريخ:':'Date:'}</b> ${t.start} - ${t.end}</p>
    <p><b>${lang==='ar'?'المكان:':'Location:'}</b> ${t.location[lang]}</p>
    <p><b>${lang==='ar'?'الفرق:':'Teams:'}</b> ${t.teams[lang]}</p>
    <div id="map"></div>
    ${liveBtn}
    <button onclick="document.getElementById('modal').style.display='none'">${lang==='ar'?'اغلاق':'Close'}</button>`;
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>{
    const map = L.map('map').setView([20,0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  }, 100);
}

function toggleTheme() { document.body.classList.toggle('light'); }
function toggleLang() {
  lang = lang==='ar'?'en':'ar';
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.getElementById('title').innerText = lang==='ar'?'🏆 GoalPro - موسوعة 150 بطولة 2026-2034':'🏆 GoalPro - 150 Tournaments Encyclopedia 2026-2034';
  document.getElementById('subtitle').innerText = lang==='ar'?'اكبر تقويم كرة قدم بالعالم العربي + البث المباشر':'Biggest Football Calendar in Arab World + Live Stream';
  filterData();
}

function filterData() {
  const search = document.getElementById('search').value.toLowerCase();
  const filter = document.getElementById('filter').value;
  const filtered = data.filter(t => {
    const matchSearch = t.name[lang].toLowerCase().includes(search);
    const matchFilter = filter === 'all' || t.type === filter || (filter === 'live' && isLive(t.start, t.end));
    return matchSearch && matchFilter;
  });

  document.getElementById('tournaments').innerHTML = '';
  filtered.forEach((t,i) => {
    const liveNow = isLive(t.start, t.end);
    let tag = t.type==='women'?'👩':t.type==='club-women'?'👩🏆':t.type==='club'?'🏆':t.type==='youth'?'👶':t.type==='futsal'?'⚽':t.type==='beach'?'🏖️':'🌍';
    document.getElementById('tournaments').innerHTML += `
      <div class="card ${liveNow? 'live' : ''}" onclick="showDetails(${data.indexOf(t)})">
        ${liveNow? '<div class="live-badge">🔴 LIVE</div>' : ''}
        <h3><span class="tag">${tag}</span>${t.name[lang]}</h3>
        <p>📅 ${t.start} - ${t.end}</p>
        <p>🌍 ${t.location[lang]}</p>
        <p class="countdown">${getCountdown(t.start)}</p>
      </div>`;
  });
}
filterData();
setInterval(filterData, 60000);
