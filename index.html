<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoalPro ULTIMATE | With AdSense</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">

<!-- 1. كود AdSense الرئيسي - الصقه هنا -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

<style>
:root{ --primary:#0047AB; --accent:#FFB800; --bg:#050811; --card:#0B1120; --text:#F8FAFC; --muted:#64748B; --live:#DC2626; --stars:#FFD700; --donate:#10B981;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg); color:var(--text);}
header{background:linear-gradient(90deg, var(--primary) 0%, #000 100%); padding:12px 0; border-bottom:3px solid var(--accent); position:sticky; top:0; z-index:9999;}
.wrap{max-width:1700px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between; gap:10px; flex-wrap:wrap;}
.logo{font-size:28px;font-weight:900; color:#fff; display:flex; align-items:center; gap:8px;}
.logo img{width:36px; height:36px; border-radius:50%;}
.btn-stars{background:var(--stars); color:#000; padding:7px 12px; border-radius:20px; font-weight:900; border:0; cursor:pointer; font-size:12px;}
.btn-donate{background:var(--donate); color:#fff; padding:7px 12px; border-radius:20px; font-weight:900; border:0; cursor:pointer; font-size:12px;}
select{background:var(--card); color:var(--text); border:1px solid var(--accent); padding:6px 10px; border-radius:6px; font-size:13px;}
.ad-box{margin:15px auto; text-align:center;}
.container{max-width:1700px;margin:15px auto;padding:0 20px;display:grid;grid-template-columns:2.2fr 1fr 1fr; gap:15px;}
.card{background:var(--card); border-radius:10px; padding:15px; border:1px solid #1E293B;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo"><img src="https://cdn-icons-png.flaticon.com/512/53/53496.png">GOAL<span>PRO</span></div>
    <nav><a href="#">Home</a><a href="#">Live</a></nav>
    <div style="display:flex; gap:6px;">
      <button class="btn-stars" onclick="alert('Stars')">⭐ Stars</button>
      <button class="btn-donate" onclick="alert('Donate')">💰 Donate</button>
    </div>
  </div>
</header>

<!-- 2. اعلان افقي فوق - 728x90 -->
<div class="ad-box">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
       data-ad-slot="YYYYYYYYYY"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="container">
  <div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1577223625816-7546f13df3d4?w=1200" style="width:100%; border-radius:10px;">
      <h2>GoalPro - موقع عالمي</h2>
    </div>
  </div>

  <div>
    <!-- 3. اعلان مربع جانبي - 300x250 -->
    <div class="card">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="ZZZZZZZZZZ"
           data-ad-format="rectangle"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>
</div>

<footer style="text-align:center; padding:30px; color:#64748B;">© 2026 GoalPro</footer>

</body>
</html>
