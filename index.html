<!DOCTYPE html>
<html lang="ar" dir="rtl"> 
<head> 
<meta charset="UTF-8"> 
<title>GoalPro - v11.2 يدوي</title> 
<style> 
:root { --bg: #0f172a; --card: #1e293b; --text: white; --accent: #38bdf8; --live: #ef4444; --today: #22c55e; } 
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; } 
.tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; } 
.tab { padding: 12px 25px; background: var(--card); border-radius: 10px; cursor: pointer; border: 2px solid transparent; } 
.tab.active { border: 2px solid var(--accent); color: var(--accent); } 
.matches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; max-width: 1300px; margin: 0 auto; } 
.match-card { background: var(--card); border-radius: 15px; padding: 15px; border-left: 5px solid var(--today); text-align: right; } 
.score { font-size: 24px; font-weight: bold; color: var(--live); } 
.live-dot { display: inline-block; width: 10px; height: 10px; background: var(--live); border-radius: 50%; animation: pulse 1.5s infinite; } 
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} } 
</style> 
</head> 
<body> 
<h1>🏆 GoalPro v11.2 - يدوي</h1> 
<div class="tabs"> 
    <div class="tab active" onclick="loadMatches('today')">⚡ مباريات اليوم</div>
    <div class="tab" onclick="loadMatches('live')">🔴 مباشر الان</div>
</div> 
<div class="matches-grid" id="matches"></div> 

<script>
// ضيف مبارياتك هنا كل يوم
const ALL_MATCHES = [
    {type: "today", t1: "الاهلي", t2: "الزمالك", time: "21:00", league: "الدوري المصري", score: " - ", status: "today"},
    {type: "live", t1: "برشلونة", t2: "ريال مدريد", time: "مباشر", league: "الليغا", score: "2 : 1", status: "live"},
    {type: "today", t1: "العراق", t2: "السعودية", time: "19:00", league: "تصفيات كاس العالم", score: " - ", status: "today"},
];

function loadMatches(type) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    
    let matchesDiv = document.getElementById('matches');
    matchesDiv.innerHTML = "";
    
    let filtered = ALL_MATCHES.filter(m => m.type === type);
    
    if(filtered.length === 0){
        matchesDiv.innerHTML = "<p>ماكو مباريات اليوم</p>";
        return;
    }
    
    filtered.forEach(m => {
        let isLive = m.status === "live";
        matchesDiv.innerHTML += `
        <div class="match-card">
            <p>${isLive? '<span class="live-dot"></span> مباشر' : m.time}</p>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>${m.t1}</span>
                <span class="score">${m.score}</span>
                <span>${m.t2}</span>
            </div>
            <p>🏆 ${m.league}</p>
        </div>`;
    });
}

// شغل مباريات اليوم اول ما يفتح
loadMatches('today');
</script> 
</body> 
</html>
