<script>
const ALL_MATCHES = [
    // دوريات اوروبا
    {type: "today", t1: "برشلونة", t2: "ريال مدريد", time: "22:00", league: "الليغا - اسبانيا", score: " - ", status: "today"},
    {type: "today", t1: "مان سيتي", t2: "ليفربول", time: "21:30", league: "البريميرليغ - انجلترا", score: " - ", status: "today"},
    {type: "today", t1: "بايرن ميونخ", t2: "دورتموند", time: "20:30", league: "البوندسليغا - المانيا", score: " - ", status: "today"},
    {type: "today", t1: "باريس", t2: "مارسيليا", time: "21:00", league: "الدوري الفرنسي", score: " - ", status: "today"},
    {type: "today", t1: "ميلان", t2: "انتر", time: "21:45", league: "الكالتشيو - ايطاليا", score: " - ", status: "today"},
    
    // بطولات العرب
    {type: "today", t1: "الاهلي", t2: "الزمالك", time: "20:00", league: "الدوري المصري", score: " - ", status: "today"},
    {type: "today", t1: "الهلال", t2: "النصر", time: "19:00", league: "الدوري السعودي", score: " - ", status: "today"},
    {type: "today", t1: "الشرطة", t2: "الزوراء", time: "18:00", league: "الدوري العراقي", score: " - ", status: "today"},
    {type: "today", t1: "الوداد", t2: "الرجاء", time: "22:00", league: "الدوري المغربي", score: " - ", status: "today"},
    
    // ابطال اوروبا
    {type: "today", t1: "السيتي", t2: "بايرن", time: "23:00", league: "دوري ابطال اوروبا", score: " - ", status: "today"},
    
    // مباشر
    {type: "live", t1: "برشلونة", t2: "ريال مدريد", time: "مباشر", league: "الليغا", score: "2 : 1", status: "live"},
];

function loadMatches(type) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    
    let matchesDiv = document.getElementById('matches');
    matchesDiv.innerHTML = "";
    
    let filtered = ALL_MATCHES.filter(m => m.type === type);
    
    if(filtered.length === 0){
        matchesDiv.innerHTML = "<p>ماكو مباريات حالياً</p>";
        return;
    }
    
    filtered.forEach(m => {
        let isLive = m.status === "live";
        matchesDiv.innerHTML += `
        <div class="match-card">
            <p>${isLive? '<span class="live-dot"></span> مباشر' : m.time}</p>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>${m.t1}</span>
                <span class="score">${m.score}</span>
                <span>${m.t2}</span>
            </div>
            <p>🏆 ${m.league}</p>
        </div>`;
    });
}
loadMatches('today');
</script>
