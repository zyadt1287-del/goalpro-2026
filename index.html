<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقويم البطولات 2026-2030 | GoalPro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
* {margin:0;padding:0;box-sizing:border-box}
body{background:#0a192f;color:#fff;font-family:'Cairo',Arial;margin:0}
.header{background:linear-gradient(135deg,#112240 0%,#0a192f 100%);padding:50px 20px;text-align:center;border-bottom:3px solid #64ffda}
h1{color:#64ffda;margin:0;font-size:36px;font-weight:700}
.header p{color:#8892b0;margin-top:10px;font-size:18px}
.container{max-width:900px;margin:40px auto;padding:20px}
.tournament{background:#112240;margin:20px 0;padding:25px;border-radius:12px;border-right:5px solid #64ffda;transition:0.3s;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.tournament:hover{transform:translateX(-8px);background:#1a365d}
.tournament h2{color:#64ffda;margin-bottom:12px;font-size:24px}
.date{color:#8892b0;font-size:15px;margin:8px 0}
.loading{text-align:center;padding:60px;color:#64ffda;font-size:20px}
.footer{text-align:center;padding:30px;color:#8892b0;font-size:14px;border-top:1px solid #112240;margin-top:40px}
</style>
</head>
<body>
<header class="header">
  <h1>🏆 تقويم البطولات 2026 - 2030</h1>
  <p>كل بطولات كرة القدم العالمية بمكان واحد</p>
</header>

<div class="container" id="tournaments">
  <p class="loading">جاري تحميل البطولات...</p>
</div>

<footer class="footer">
  © 2026 GoalPro | جميع الحقوق محفوظة
</footer>

<script>
fetch('tournaments.json')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('tournaments');
    container.innerHTML = '';
    data.tournaments.forEach(t => {
      container.innerHTML += `
        <div class="tournament">
          <h2>${t.name}</h2>
          <p class="date">📅 من ${t.date_start} الى ${t.date_end}</p>
          <p>📍 الدولة المستضيفة: ${t.country}</p>
          <p>👥 عدد الفرق المشاركة: ${t.teams}</p>
          <p>🔥 الحالة: ${t.status}</p>
        </div>
      `;
    });
  })
  .catch(error => {
    document.getElementById('tournaments').innerHTML = '<p class="loading">حدث خطأ في تحميل البيانات</p>';
  });
</script>
</body>
</html>
