<div style="background:#111; padding:15px; border-radius:10px; text-align:center; margin:20px 0;">
<h3>💳 My Wallet</h3>
<p>Connect your wallet to receive payments</p>
<p><b>USDT:</b> TAVcAjW4AGXDe2rpycmVroPxfU3p2MZ59v</p>
<p id="status" style="color:orange;">Not Connected</p>
<button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
<div id="donateButtons" style="display:none; margin-top:15px;">
<button onclick="donate('5')">Donate 5 USDT ⭐</button>
<button onclick="donate('0.01')" style="background:green; color:white;">تجربة 0.01 USDT</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
<script>
let web3,userAddress;
const USDT_CONTRACT="0x55d398326b99059fF775485246999027B3197955";
const YOUR_WALLET="TAVcAjW4AGXDe2rpycmVroPxfU3p2MZ59v";
async function connectWallet(){if(window.ethereum){web3=new Web3(window.ethereum);const a=await ethereum.request({method:'eth_requestAccounts'});userAddress=a[0];document.getElementById("status").innerText="Connected";document.getElementById("donateButtons").style.display="block";document.getElementById("connectBtn").style.display="none";}else{alert("افتح من DApp");}}
async function donate(amount){const usdtAmount=web3.utils.toWei(amount,'mwei');const c=new web3.eth.Contract([{"constant":false,"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"type":"function"}],USDT_CONTRACT);try{await c.methods.transfer(YOUR_WALLET,usdtAmount).send({from:userAddress});alert("✅ تم "+amount+" USDT")}catch(e){alert("❌ الغاء")}}
</script>
