<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOALPRO ORANGE - 200+ Tournaments</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1A0F00;color:#fff;font-family:Arial;text-align:center}
header{background:linear-gradient(90deg,#FF6A00,#FF3D00);padding:25px}
h1{font-size:32px;font-weight:900}
.lang-btn{background:#FFD700;color:#000;border:none;padding:8px 15px;border-radius:20px;margin:5px;cursor:pointer;font-weight:900}
.search{margin:20px;padding:15px;width:90%;max-width:500px;border-radius:10px;border:2px solid #FF6A00;background:#111;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:20px;max-width:1200px;margin:auto}
.card{background:#111;border:2px solid #FF6A00;border-radius:12px;padding:15px;text-align:left;transition:0.3s}
.card:hover{border-color:#FFD700;transform:scale(1.02)}
.card h3{color:#FF6A00;margin-bottom:5px}
.card p{color:#aaa;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🏆 GOALPRO ORANGE</h1>
<p>English 🏆 200+ Worldwide Tournaments 2026-2034</p>
<button class="lang-btn" onclick="alert('Language switch coming soon')">AR العربية</button>
</header>

<input type="text" id="search" class="search" placeholder="Search tournament... ابحث عن بطولة">

<div class="grid" id="tournaments"></div>

<script>
const tournaments = [
{name:"UCL UEFA Champions League",info:"Europe"},
{name:"Premier League",info:"England • 20 Teams"},
{name:"La Liga",info:"Spain • 20 Teams"},
{name:"Bundesliga",info:"Germany • 18 Teams"},
{name:"Serie A",info:"Italy • 20 Teams"},
{name:"World Cup 2026",info:"FIFA • 48 Teams"},
{name:"Euro 2028",info:"UEFA • 24 Teams"},
{name:"Saudi Pro League",info:"Saudi Arabia • 18 Teams"},
{name:"MLS",info:"USA • 30 Teams"}
];
// نكمل الباقي لحد 200
for(let i=1;i<=63;i++){tournaments.push({name:`League ${i} Worldwide`,info:`${15+i} Teams`})}

const grid = document.getElementById('tournaments');
function render(list){
grid.innerHTML = list.map(t=>`<div class="card"><h3>${t.name}</h3><p>${t.info}</p></div>`).join('');
}
render(tournaments);

document.getElementById('search').addEventListener('input',e=>{
const val = e.target.value.toLowerCase();
render(tournaments.filter(t=>t.name.toLowerCase().includes(val)||t.info.toLowerCase().includes(val)));
});
</script>
</body>
</html>
